<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work</title>
<meta name="description" content="Architectural visualization.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:#fff;
  color:#000;
  font:400 13px/1.35 "Inter",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none}

/* ---------- header ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  padding:20px;
  mix-blend-mode:difference;   /* stays legible over pale and dark tiles alike */
  color:#fff;
}
.logo{
  font-weight:500; font-size:13px; letter-spacing:.01em;
}
nav{display:flex; gap:20px}
nav a{opacity:.6; transition:opacity .25s ease}
nav a:hover, nav a[aria-current]{opacity:1}

/* ---------- grid ---------- */
.work{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:64px 20px 20px;
}
.item{display:block}

.frame{
  position:relative;
  width:100%;
  aspect-ratio:3/2;
  background:#eee;
  overflow:hidden;
}
.frame img{
  width:100%; height:100%; object-fit:cover; display:block;
  transform:scale(1.001);
  transition:transform 1.2s cubic-bezier(.22,1,.36,1);
}
.item:hover .frame img{transform:scale(1.04)}

/* Caption sits over the tile and fades up on hover, the way the reference
   keeps the grid silent until you point at something. */
.caption{
  position:absolute; left:0; right:0; bottom:0;
  padding:14px 16px;
  display:flex; justify-content:space-between; align-items:flex-end; gap:16px;
  color:#fff;
  opacity:0; transform:translateY(6px);
  transition:opacity .4s ease, transform .4s cubic-bezier(.22,1,.36,1);
  background:linear-gradient(to top, rgba(0,0,0,.42), rgba(0,0,0,0));
}
.item:hover .caption{opacity:1; transform:none}
.caption .title{font-weight:500}
.caption .client{opacity:.75; text-align:right; flex:0 0 auto}

@media (max-width:900px){
  .work{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .work{grid-template-columns:1fr; gap:14px; padding:60px 14px 14px}
  /* Touch has no hover, so the caption is always shown. */
  .caption{opacity:1; transform:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="./">Aram Kapoudjian</a>
  <nav>
    <a href="./" aria-current="page">Work</a>
    <a href="#archive">Archive</a>
    <a href="#info">Info</a>
  </nav>
</header>

<main class="work" id="work"></main>

<script>
const PROJECTS = [
  ["The Summit",           "Architectural Visualization"],
  ["The Grove",            "Architectural Visualization"],
  ["The Duo",              "Architectural Visualization"],
  ["The Ridge",            "Architectural Visualization"],
  ["The Ember",            "Architectural Visualization"],
  ["The Shade",            "Architectural Visualization"],
  ["The Glow",             "Architectural Visualization"],
  ["The District",         "Architectural Visualization"],
  ["The Stack",            "Architectural Visualization"],
  ["The Lagoon",           "Architectural Visualization"],
  ["The Residence",        "Architectural Visualization"],
  ["Placed — A VFX Series","Architectural Visualization"],
];

document.getElementById("work").innerHTML = PROJECTS.map(([name, client], i) => `
  <a class="item" href="#project-${i + 1}">
    <div class="frame">
      <div class="caption">
        <span class="title">${name}</span>
        <span class="client">${client}</span>
      </div>
    </div>
  </a>`).join("");
</script>
</body>
</html>
